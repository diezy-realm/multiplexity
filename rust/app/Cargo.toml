[package]
name = "multiplexity-backend"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
publish = false

[lib]
name = "multiplexity_backend"
path = "src/lib.rs"

[[bin]]
name = "multiplexity-server"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "ws"] }
base64 = "0.22"
bcrypt = "0.17"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
futures-util = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1"
native-tls = "0.2"
percent-encoding = "2"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies", "multipart"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
socketioxide = "0.18"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "chrono", "json", "bigdecimal", "uuid"] }
ssh2 = "0.9"
subtle = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
